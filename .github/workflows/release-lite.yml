name: Release Lite (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.6.15 or lite-v0.6.15"
        required: true
        type: string
      sign:
        description: "Sign Windows / macOS artifacts (requires signing secrets & vars). Leave OFF for local use."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ============================================================
  # 1. 规范化 tag + 创建 draft release
  # ============================================================
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.norm.outputs.tag }}
      version: ${{ steps.norm.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Normalize input tag
        id: norm
        shell: bash
        run: |
          RAW="${{ inputs.tag }}"
          RAW="${RAW#refs/tags/}"
          RAW="${RAW#lite-v}"
          RAW="${RAW#v}"
          if ! [[ "$RAW" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$RAW' (expected e.g. 0.6.15, v0.6.15 or lite-v0.6.15)"
            exit 1
          fi
          echo "tag=lite-v${RAW}"   >> "$GITHUB_OUTPUT"
          echo "version=${RAW}"     >> "$GITHUB_OUTPUT"
          echo "Normalized: lite-v${RAW} (version ${RAW})"

      - name: Create tag + draft release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.norm.outputs.tag }}"
          REPO="${{ github.repository }}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Draft release for $TAG already exists."
          else
            echo "Creating draft release $TAG on $(git rev-parse HEAD)"
            gh release create "$TAG" \
              --repo "$REPO" \
              --draft \
              --title "$TAG" \
              --target "$(git rev-parse HEAD)"
          fi

  # ============================================================
  # 2. macOS（x86_64 + aarch64）
  # ============================================================
  build-macos:
    name: build (${{ matrix.platform }}, ${{ matrix.target }})
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            asset_pattern: "DBX_[version]_arm64[setup][ext]"
          - platform: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: ${{ secrets.SCCACHE_S3_BUCKET == '' && 'true' || 'false' }}
      RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install frontend dependencies
        run: pnpm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: "v0.10.0"

      - name: Configure S3 sccache
        if: env.SCCACHE_GHA_ENABLED != 'true'
        shell: bash
        env:
          CACHE_BUCKET: ${{ secrets.SCCACHE_S3_BUCKET }}
          CACHE_ENDPOINT: ${{ secrets.SCCACHE_S3_ENDPOINT }}
          CACHE_REGION: ${{ secrets.SCCACHE_S3_REGION }}
          CACHE_KEY_PREFIX: ${{ secrets.SCCACHE_S3_KEY_PREFIX }}
          CACHE_ACCESS_KEY_ID: ${{ secrets.SCCACHE_S3_ACCESS_KEY_ID }}
          CACHE_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_S3_SECRET_ACCESS_KEY }}
        run: |
          {
            echo "SCCACHE_BUCKET=${CACHE_BUCKET}"
            echo "SCCACHE_ENDPOINT=${CACHE_ENDPOINT}"
            echo "SCCACHE_REGION=${CACHE_REGION}"
            echo "SCCACHE_S3_KEY_PREFIX=${CACHE_KEY_PREFIX}"
            echo "SCCACHE_S3_USE_SSL=true"
            echo "AWS_ACCESS_KEY_ID=${CACHE_ACCESS_KEY_ID}"
            echo "AWS_SECRET_ACCESS_KEY=${CACHE_SECRET_ACCESS_KEY}"
            echo "SCCACHE_IDLE_TIMEOUT=0"
            case "${RUNNER_OS}" in
              Linux)
                echo "CC=${SCCACHE_PATH} cc"
                echo "CXX=${SCCACHE_PATH} c++"
                ;;
              macOS)
                echo "CC=${SCCACHE_PATH} clang"
                echo "CXX=${SCCACHE_PATH} clang++"
                ;;
            esac
          } >> "$GITHUB_ENV"

      - name: Compute Rust dependency hash
        id: deps-hash
        shell: bash
        run: |
          {
            find . -name Cargo.toml -not -path './target/*' -print0 \
              | sort -z \
              | xargs -0 sed -E '/^version = /d'
            grep -v '^version = ' Cargo.lock
          } | sha256sum | cut -d' ' -f1 | {
            read -r hash
            echo "hash=${hash:0:20}" >> "$GITHUB_OUTPUT"
          }

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"
          shared-key: release-${{ matrix.target }}-${{ steps.deps-hash.outputs.hash }}
          add-rust-environment-hash-key: false
          cache-targets: false
          cache-on-failure: true

      - name: Install Apple certificate (macOS)
        if: ${{ inputs.sign }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain-db

      - name: Setup Tauri signing key
        shell: bash
        run: |
          echo "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/updater.key"
          KEY_B64=$(base64 < "$RUNNER_TEMP/updater.key" | tr -d '\r\n')
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY_B64" >> "$GITHUB_ENV"
          if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # When sign=true use the real identity; otherwise use ad-hoc "-" so
          # the DMG can still be produced without a Developer ID certificate.
          APPLE_SIGNING_IDENTITY: ${{ inputs.sign && secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_ID: ${{ inputs.sign && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ inputs.sign && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.sign && secrets.APPLE_TEAM_ID || '' }}
        with:
          tagName: ${{ needs.prepare-release.outputs.tag }}
          releaseDraft: true
          assetNamePattern: ${{ matrix.asset_pattern }}
          args: --target ${{ matrix.target }}

      - name: Show sccache stats
        if: always()
        continue-on-error: true
        shell: bash
        run: ${SCCACHE_PATH} --show-stats

  # ============================================================
  # 3. Windows 10/11 offline 安装包（x64 + arm64）
  # ============================================================
  build-windows-10-offline:
    name: win10-offline (${{ matrix.arch }})
    needs: prepare-release
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    runs-on: windows-2022
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: ${{ secrets.SCCACHE_S3_BUCKET == '' && 'true' || 'false' }}
      VSIGN_CERT_HASH: ${{ vars.VSIGN_CERT_HASH }}
      VSIGN_OPERATOR_SHA1: ${{ vars.VSIGN_OPERATOR_SHA1 }}
      VSIGN_SERVER: ${{ vars.VSIGN_SERVER }}
      VSIGN_TOOL_SHA256: ${{ vars.VSIGN_TOOL_SHA256 }}
      RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
      DO_SIGN: ${{ inputs.sign && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install frontend dependencies
        run: pnpm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: "v0.10.0"

      - name: Configure S3 sccache
        if: env.SCCACHE_GHA_ENABLED != 'true'
        shell: bash
        env:
          CACHE_BUCKET: ${{ secrets.SCCACHE_S3_BUCKET }}
          CACHE_ENDPOINT: ${{ secrets.SCCACHE_S3_ENDPOINT }}
          CACHE_REGION: ${{ secrets.SCCACHE_S3_REGION }}
          CACHE_KEY_PREFIX: ${{ secrets.SCCACHE_S3_KEY_PREFIX }}
          CACHE_ACCESS_KEY_ID: ${{ secrets.SCCACHE_S3_ACCESS_KEY_ID }}
          CACHE_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_S3_SECRET_ACCESS_KEY }}
        run: |
          {
            echo "SCCACHE_BUCKET=${CACHE_BUCKET}"
            echo "SCCACHE_ENDPOINT=${CACHE_ENDPOINT}"
            echo "SCCACHE_REGION=${CACHE_REGION}"
            echo "SCCACHE_S3_KEY_PREFIX=${CACHE_KEY_PREFIX}"
            echo "SCCACHE_S3_USE_SSL=true"
            echo "AWS_ACCESS_KEY_ID=${CACHE_ACCESS_KEY_ID}"
            echo "AWS_SECRET_ACCESS_KEY=${CACHE_SECRET_ACCESS_KEY}"
            echo "SCCACHE_IDLE_TIMEOUT=0"
          } >> "$GITHUB_ENV"

      - name: Compute Rust dependency hash
        id: deps-hash
        shell: bash
        run: |
          {
            find . -name Cargo.toml -not -path './target/*' -print0 \
              | sort -z \
              | xargs -0 sed -E '/^version = /d'
            grep -v '^version = ' Cargo.lock
          } | sha256sum | cut -d' ' -f1 | {
            read -r hash
            echo "hash=${hash:0:20}" >> "$GITHUB_OUTPUT"
          }

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"
          shared-key: release-${{ matrix.target }}-${{ steps.deps-hash.outputs.hash }}
          add-rust-environment-hash-key: false
          cache-targets: false
          cache-on-failure: true

      - name: Setup Tauri signing key
        shell: bash
        run: |
          echo "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/updater.key"
          KEY_B64=$(base64 < "$RUNNER_TEMP/updater.key" | tr -d '\r\n')
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY_B64" >> "$GITHUB_ENV"
          if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Setup TrustAsia VSign
        if: env.DO_SIGN == 'true'
        shell: pwsh
        env:
          VSIGN_OPERATOR_PFX_B64: ${{ secrets.VSIGN_OPERATOR_PFX_B64 }}
          VSIGN_OPERATOR_PWD: ${{ secrets.VSIGN_OPERATOR_PWD }}
        run: ./.github/scripts/setup-vsign.ps1

      - name: Build frontend and Windows executable
        shell: pwsh
        run: pnpm tauri build --target ${{ matrix.target }} --no-bundle

      - name: Build and upload WebView2 offline installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SSIGNCODE_OPERATOR_PWD: ${{ secrets.VSIGN_OPERATOR_PWD }}
          VSIGN_KEY_PIN: ${{ secrets.VSIGN_KEY_PIN }}
        run: |
          $version = $env:RELEASE_VERSION
          $arch = "${{ matrix.arch }}"
          $bundleDir = "target/${{ matrix.target }}/release/bundle/nsis"
          $offlineName = "DBX_${version}_${arch}-offline-setup.exe"
          $before = @{}

          if (Test-Path $bundleDir) {
            Get-ChildItem $bundleDir -Filter "*.exe" | ForEach-Object { $before[$_.FullName] = $_.LastWriteTimeUtc }
          }

          if ($env:DO_SIGN -eq "true") {
            pnpm tauri bundle --bundles nsis --target ${{ matrix.target }} `
              --config src-tauri/tauri.webview2-offline.conf.json `
              --config src-tauri/tauri.vsign.conf.json
          } else {
            pnpm tauri bundle --bundles nsis --target ${{ matrix.target }} `
              --config src-tauri/tauri.webview2-offline.conf.json
          }

          $installer = Get-ChildItem $bundleDir -Filter "*.exe" |
            Where-Object { !$before.ContainsKey($_.FullName) -or $_.LastWriteTimeUtc -gt $before[$_.FullName] } |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1

          if (!$installer) {
            throw "Missing WebView2 offline installer in ${bundleDir}"
          }

          if ($env:DO_SIGN -eq "true") {
            ./.github/scripts/assert-authenticode.ps1 -Path $installer.FullName
          }

          Copy-Item $installer.FullName $offlineName -Force
          gh release upload "${env:RELEASE_TAG}" $offlineName `
            --repo "${env:GITHUB_REPOSITORY}" --clobber

      - name: Show sccache stats
        if: always()
        continue-on-error: true
        shell: bash
        run: ${SCCACHE_PATH} --show-stats

      - name: Remove temporary VSign files
        if: always()
        shell: pwsh
        run: |
          $workDir = if ([string]::IsNullOrWhiteSpace($env:VSIGN_WORK_DIR)) {
            Join-Path $env:RUNNER_TEMP "vsign-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          } else {
            $env:VSIGN_WORK_DIR
          }
          if (Test-Path -LiteralPath $workDir) {
            Remove-Item -LiteralPath $workDir -Recurse -Force
          }

  # ============================================================
  # 4. Windows 7 / Server 2012 R2 offline 安装包
  # ============================================================
  build-windows-7-offline:
    name: win7-offline
    needs: prepare-release
    runs-on: windows-2022
    environment: release-signing
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: -C debuginfo=line-tables-only -C target-feature=+crt-static
      VSIGN_CERT_HASH: ${{ vars.VSIGN_CERT_HASH }}
      VSIGN_OPERATOR_SHA1: ${{ vars.VSIGN_OPERATOR_SHA1 }}
      VSIGN_SERVER: ${{ vars.VSIGN_SERVER }}
      VSIGN_TOOL_SHA256: ${{ vars.VSIGN_TOOL_SHA256 }}
      RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
      DO_SIGN: ${{ inputs.sign && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install frontend dependencies
        run: pnpm install

      - name: Setup Rust for Windows 7
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-07-22
          components: rust-src

      - name: Prepare Win7-compatible WebView2 loader
        shell: pwsh
        run: ./.github/scripts/prepare-webview2-win7-loader.ps1

      - name: Prepare WebView2 109 fixed runtime
        shell: pwsh
        run: ./.github/scripts/prepare-webview2-win7-runtime.ps1

      - name: Probe WebView2 109 fixed runtime
        shell: pwsh
        run: ./.github/scripts/assert-webview2-win7-runtime.ps1

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"
          shared-key: release-x86_64-win7-windows-msvc
          add-rust-environment-hash-key: true
          cache-targets: false
          cache-on-failure: true

      - name: Build frontend
        run: pnpm build

      - name: Build DBX for Windows 7
        shell: pwsh
        run: |
          $env:TAURI_CONFIG = Get-Content src-tauri/tauri.webview2-win7-fixed.conf.json -Raw
          cargo build --locked --package dbx --release --features custom-protocol --target x86_64-win7-windows-msvc -Z build-std=std,panic_abort

      - name: Audit Windows 7 PE imports
        shell: pwsh
        run: ./.github/scripts/assert-win7-pe-compat.ps1 -BinaryPath target/x86_64-win7-windows-msvc/release/dbx.exe

      - name: Audit Win7 WebView2 loader markers
        shell: pwsh
        run: ./.github/scripts/assert-webview2-win7-loader.ps1 -BinaryPath target/x86_64-win7-windows-msvc/release/dbx.exe

      - name: Setup TrustAsia VSign
        if: env.DO_SIGN == 'true'
        shell: pwsh
        env:
          VSIGN_OPERATOR_PFX_B64: ${{ secrets.VSIGN_OPERATOR_PFX_B64 }}
          VSIGN_OPERATOR_PWD: ${{ secrets.VSIGN_OPERATOR_PWD }}
        run: ./.github/scripts/setup-vsign.ps1

      - name: Bundle and upload Windows 7 / Server 2012 R2 fixed-runtime installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SSIGNCODE_OPERATOR_PWD: ${{ secrets.VSIGN_OPERATOR_PWD }}
          VSIGN_KEY_PIN: ${{ secrets.VSIGN_KEY_PIN }}
        run: |
          $version = $env:RELEASE_VERSION
          $bundleDir = "target/x86_64-win7-windows-msvc/release/bundle/nsis"
          $offlineName = "DBX_${version}_x64-win7-server2012r2-offline-setup.exe"
          $checksumName = "${offlineName}.sha256"
          $cargoMetadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $appVersion = ($cargoMetadata.packages | Where-Object { $_.name -eq "dbx" } | Select-Object -First 1).version

          if (!$appVersion -or $appVersion -ne $version) {
            Write-Error "Release tag version $version does not match the built DBX package version $appVersion"
            exit 1
          }

          if ($env:DO_SIGN -eq "true") {
            pnpm tauri bundle --bundles nsis --target x86_64-win7-windows-msvc `
              --config src-tauri/tauri.webview2-win7-fixed.conf.json `
              --config src-tauri/tauri.vsign.conf.json
          } else {
            pnpm tauri bundle --bundles nsis --target x86_64-win7-windows-msvc `
              --config src-tauri/tauri.webview2-win7-fixed.conf.json
          }

          $installer = Get-ChildItem $bundleDir -Filter "*.exe" |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if (!$installer) {
            Write-Error "Missing Windows 7 / Server 2012 R2 fixed-runtime installer in ${bundleDir}"
            exit 1
          }

          ./.github/scripts/assert-win7-installer-content.ps1 -InstallerPath $installer.FullName
          if ($env:DO_SIGN -eq "true") {
            ./.github/scripts/assert-authenticode.ps1 -Path $installer.FullName
          }

          Copy-Item $installer.FullName $offlineName -Force
          $hash = (Get-FileHash -LiteralPath $offlineName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $offlineName" | Set-Content -LiteralPath $checksumName -Encoding ascii
          gh release upload "${env:RELEASE_TAG}" $offlineName $checksumName `
            --repo "${env:GITHUB_REPOSITORY}" --clobber

      - name: Remove temporary VSign files
        if: always()
        shell: pwsh
        run: |
          $workDir = if ([string]::IsNullOrWhiteSpace($env:VSIGN_WORK_DIR)) {
            Join-Path $env:RUNNER_TEMP "vsign-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          } else {
            $env:VSIGN_WORK_DIR
          }
          if (Test-Path -LiteralPath $workDir) {
            Remove-Item -LiteralPath $workDir -Recurse -Force
          }

  # ============================================================
  # 5. 发布（把 draft 变成 prerelease）
  # ============================================================
  publish:
    needs: [prepare-release, build-macos, build-windows-10-offline, build-windows-7-offline]
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.prepare-release.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --draft=false --prerelease